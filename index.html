<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Garden Route Golf Tour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky scoreboard header, one scrolling column of panels, fixed bottom tab bar (phone first). */
:root{
  --bg:#eef0e9; --card:#ffffff; --ink:#15201a; --muted:#5b685f; --line:#d6dbcf; --soft:#f5f6f1;
  --gold:#8f640a; --gold-fill:#e3ab33; --gold-soft:#f8ecd0;
  --green:#28603a; --green-fill:#3d8250; --green-soft:#dcecdf;
  --warn:#a23a26;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1310; --card:#171f1a; --ink:#eef1ea; --muted:#9ba79e; --line:#2b362f; --soft:#1e2822;
  --gold:#ebbb4b; --gold-fill:#d9a02a; --gold-soft:#3a2f14;
  --green:#7ccb8d; --green-fill:#3f8a54; --green-soft:#1b3323;
  --warn:#f08a74; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1310; --card:#171f1a; --ink:#eef1ea; --muted:#9ba79e; --line:#2b362f; --soft:#1e2822;
  --gold:#ebbb4b; --gold-fill:#d9a02a; --gold-soft:#3a2f14;
  --green:#7ccb8d; --green-fill:#3f8a54; --green-soft:#1b3323;
  --warn:#f08a74; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;
  margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.board-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;gap:4px 10px;min-width:0}
.side.m{justify-content:end}
.side .nm{grid-column:1 / -1}
.side.m img{order:2}.side.m .nm{order:3}
.side img{width:52px;height:52px;border-radius:10px;flex:none}
.side .nm{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:5px;align-items:center}
.side.m .nm{justify-content:flex-end}
.side.s .nm{color:var(--gold)} .side.m .nm{color:var(--green)}
.side .sc{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.mid{text-align:center}
.mid b{font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:.04em}
.mid span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:8px;max-width:640px;margin-inline:auto;background:var(--line)}
.bar i{display:block;height:100%} .bar .s{background:var(--gold-fill)} .bar .m{background:var(--green-fill)}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.status.warn{color:var(--warn)}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);font-size:13px;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>.ph>.sub{white-space:nowrap}
.panel>.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-width:0}
.panel>.row:first-child,.ph+.row,.ph+details>summary.row{border-top:0}
.grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.S{background:var(--gold-fill)} .dot.M{background:var(--green-fill)}
.S-t{color:var(--gold)} .M-t{color:var(--green)}
.pos{font-family:var(--display);font-weight:700;font-size:20px;width:22px;text-align:center;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.num{text-align:right;min-width:44px}
.num small,.lbl{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.S{background:var(--gold-soft);color:var(--gold)} .pill.M{background:var(--green-soft);color:var(--green)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.scroll{overflow-x:auto;border-top:1px solid var(--line);background:var(--soft)}
table.card{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
table.card th,table.card td{padding:5px 6px;text-align:center;min-width:26px;border-right:1px solid var(--line)}
table.card th:first-child,table.card td:first-child{text-align:left;position:sticky;left:0;background:var(--soft);min-width:84px;font-weight:600}
table.card thead th{color:var(--muted);font-weight:500}
td.wS{background:var(--gold-soft);color:var(--gold);font-weight:600} td.wM{background:var(--green-soft);color:var(--green);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.2}
.seg button small{display:block;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.holes button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 0;font-weight:600}
.holes button.done{background:var(--soft);color:var(--muted)}
.holes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.holehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.holehead .big{font-size:30px}
.nav{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:22px;line-height:1;font-weight:600}
.step button:disabled{opacity:.4;cursor:default}
.step output{width:34px;text-align:center;font-family:var(--display);font-weight:700;font-size:26px}
.clr{border:0;background:none;color:var(--muted);font-size:12px;padding:4px;text-decoration:underline}
.res{padding:9px 14px;border-top:1px solid var(--line);background:var(--soft);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard.S{border-top:4px solid var(--gold-fill)} .tcard.M{border-top:4px solid var(--green-fill)}
.tcard .big{font-size:40px}
.kv{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.form{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow input[type=text]{flex:1;min-width:0}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px}
input[type=number]{width:64px;text-align:center}
select{flex:1;min-width:0}
.ab{display:flex;gap:4px;flex:none}
.ab button{width:40px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600}
.ab button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;padding:12px 14px}
.cgrid input{width:100%}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn);color:var(--card)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--warn)} .msg.ok{color:var(--green)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:12px 2px 11px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--gold-fill)}
@media (max-width:380px){.side img{width:42px;height:42px}.side .sc{font-size:32px}.step button{width:38px;height:38px}}
</style>
</head>

function player(cfg,id){ return cfg.players.find(p=>p.id===id); }
function hole(cfg,scores,r,pid,i){
  const p=player(cfg,pid), c=cfg.courses[r], g=((scores[r]||{})[pid]||[])[i]||0, st=strokes(p?p.hcp:0,c.si[i]);
  return {g, st, pts:pts(g,c.par[i],st)};
}
function matches(cfg,r){
  if(r<2) return ['A','B'].map(g=>({id:g,
    S:cfg.players.filter(p=>p.team==='S'&&cfg.pairs[r][p.id]===g).map(p=>p.id),
    M:cfg.players.filter(p=>p.team==='M'&&cfg.pairs[r][p.id]===g).map(p=>p.id)}));
  return cfg.singles.map((x,i)=>({id:String(i+1),S:[x.s],M:[x.m]}));
}
function sidePts(fmt, arr){
  if(!arr.length || arr.some(v=>v==null)) return null;
  return fmt==='mult' ? arr.reduce((a,b)=>a*b,1) : Math.max(...arr);
}
function matchState(cfg,scores,r,m){
  const fmt=FMT[r].key, holes=[]; let sW=0,mW=0,played=0;
  for(let i=0;i<18;i++){
    const s=sidePts(fmt,m.S.map(id=>hole(cfg,scores,r,id,i).pts)), q=sidePts(fmt,m.M.map(id=>hole(cfg,scores,r,id,i).pts));
    let res=null;
    if(s!=null&&q!=null){ played++; res=s>q?'S':q>s?'M':'H'; if(res==='S')sW++; if(res==='M')mW++; }
    holes.push({s,q,res});
  }
  const up=sW-mW, left=18-played, lead=up>0?'S':up<0?'M':null, a=Math.abs(up);
  const decided=played>0&&(left===0||a>left);
  let text='Not started';
  if(played>0){
    if(left===0) text=lead?TEAM[lead]+' win '+a+' up':'Halved';
    else if(decided) text=TEAM[lead]+' win '+a+' & '+left;
    else text=(lead?TEAM[lead]+' '+a+' up':'All square')+' thru '+played;
  }
  const live={S:0,M:0}, won={S:0,M:0};
  if(played>0){ if(lead) live[lead]=1; else {live.S=.5;live.M=.5} }
  if(decided){ won.S=live.S; won.M=live.M; }
  return {holes,sW,mW,played,left,lead,decided,text,live,won};
}
function cup(cfg,scores){
  const out={won:{S:0,M:0},live:{S:0,M:0},rounds:[]};
  for(let r=0;r<3;r++){
    const ms=matches(cfg,r).map(m=>({m,st:matchState(cfg,scores,r,m)})), rw={S:0,M:0};
    ms.forEach(x=>{ ['S','M'].forEach(t=>{ out.won[t]+=x.st.won[t]; out.live[t]+=x.st.live[t]; rw[t]+=x.st.won[t]; }); });
    out.rounds.push({ms,won:rw});
  }
  return out;
}
function individuals(cfg,scores){
  return cfg.players.map(p=>{
    const rounds=[0,1,2].map(r=>{ let s=0,pt=0,thru=0;
      for(let i=0;i<18;i++){ const h=hole(cfg,scores,r,p.id,i); if(h.g>0){s+=h.g;pt+=h.pts;thru++;} }
      return {strokes:s,pts:pt,thru}; });
    return {p,rounds,strokes:rounds.reduce((a,x)=>a+x.strokes,0),pts:rounds.reduce((a,x)=>a+x.pts,0),thru:rounds.reduce((a,x)=>a+x.thru,0)};
  }).sort((a,b)=>b.pts-a.pts || (b.thru>0)-(a.thru>0) || a.strokes-b.strokes || a.p.name.localeCompare(b.p.name));
}
function teams(cfg,scores){
  const ind=individuals(cfg,scores), out={};
  ['S','M'].forEach(t=>{ const mine=ind.filter(x=>x.p.team===t);
    out[t]={strokes:mine.reduce((a,x)=>a+x.strokes,0),pts:mine.reduce((a,x)=>a+x.pts,0),
      rounds:[0,1,2].map(r=>({strokes:mine.reduce((a,x)=>a+x.rounds[r].strokes,0),pts:mine.reduce((a,x)=>a+x.rounds[r].pts,0)}))}; });
  return out;
}
function validate(cfg){
  for(let r=0;r<2;r++) for(const t of ['S','M']) for(const g of ['A','B'])
    if(cfg.players.filter(p=>p.team===t&&cfg.pairs[r][p.id]===g).length!==2)
      return 'Day '+(r+1)+': '+TEAM[t]+' need two players in pair A and two in pair B.';
  const ms=cfg.singles.map(x=>x.m);
  if(new Set(ms).size!==4) return 'Day 3: each Mulligan must be drawn against exactly one Stinger.';
  for(const c of cfg.courses){
    if(c.par.some(v=>!(v>=3&&v<=6))) return c.name+': every par must be between 3 and 6.';
    if(new Set(c.si).size!==18||c.si.some(v=>!(v>=1&&v<=18))) return c.name+': stroke indexes must be 1 to 18, each used once.';
  }
  return '';
}

const dirty=new Set(), timers={}, chain={};

function nm(id){const p=player(cfg,id);return p?p.name:'?'}
function names(ids){return ids.map(nm).map(esc).join(' &amp; ')||'Not set'}

function renderBoard(){
  const c=cup(cfg,scores);
  $('scS').textContent=half(c.won.S); $('scM').textContent=half(c.won.M);
  const tot=c.won.S+c.won.M;
  $('barS').style.width=(tot?c.won.S/8*100:0)+'%'; $('barM').style.width=(tot?c.won.M/8*100:0)+'%';

function setStatus(){

  el.className='status';
  el.textContent=canWrite?'Live · scores save for everyone as you enter them':'Live · enter the scorer PIN under Scores to capture';
}

function table(head,rows){
  return '<div class="scroll"><table class="card"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>i?(c&&c.cls?'<td class="'+c.cls+'">'+c.v+'</td>':'<td>'+c+'</td>'):'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
const HEAD=['Hole',...Array.from({length:18},(_,i)=>i+1),'Tot'];
const show=v=>v==null?'·':v;

function vCup(c){
  let h='<h2>Tour Cup</h2><p class="sub">Each match is worth 1 point, ½ each if halved. 8 points in play; 4½ wins the cup. Live projection: Stingers '+half(c.live.S)+' – '+half(c.live.M)+' Mulligans.</p>';
  c.rounds.forEach((R,r)=>{
    h+='<section class="panel"><div class="ph"><h3>Day '+(r+1)+' · '+FMT[r].name+'</h3><span class="sub">'+esc(cfg.courses[r].name)+' · '+half(R.won.S)+' – '+half(R.won.M)+'</span></div>';
    R.ms.forEach(x=>{
      const st=x.st, cls=st.lead||'';
      h+='<details><summary class="row"><span class="chev">›</span><div class="grow"><div><span class="S-t">'+names(x.m.S)+'</span> <span class="sub" style="display:inline">v</span> <span class="M-t">'+names(x.m.M)+'</span></div>'+
        '<div class="sub">Holes won '+st.sW+' – '+st.mW+'</div></div><span class="pill '+cls+'">'+esc(st.text)+'</span></summary>'+
        table(HEAD,[
          ['Stingers',...st.holes.map(o=>({v:show(o.s),cls:o.res==='S'?'wS':''})),st.sW],
          ['Mulligans',...st.holes.map(o=>({v:show(o.q),cls:o.res==='M'?'wM':''})),st.mW]])+'</details>';
    });
    h+='</section>';
  });
  return h;
}
function vPlayers(){
  const ind=individuals(cfg,scores);
  let h='<h2>Individual leaderboard</h2><p class="sub">Ranked on net Stableford points over all three rounds. Strokes are gross. Tap a player for the hole-by-hole card.</p><section class="panel">';
  let pos=0,last=null;
  ind.forEach((x,i)=>{
    if(x.pts!==last){pos=i+1;last=x.pts}
    const rows=[];
    [0,1,2].forEach(r=>{ const hs=Array.from({length:18},(_,k)=>hole(cfg,scores,r,x.p.id,k));
      rows.push([esc(cfg.courses[r].name),...hs.map(o=>o.g||'·'),x.rounds[r].strokes||'·']);
      rows.push(['Points',...hs.map(o=>show(o.pts)),x.rounds[r].pts]); });
    h+='<details><summary class="row"><span class="pos">'+pos+'</span><span class="dot '+x.p.team+'"></span><div class="grow"><div style="font-weight:600">'+esc(x.p.name)+'</div><div class="sub">Hcp '+x.p.hcp+' · '+x.rounds.map(o=>o.pts).join(' / ')+' pts by round</div></div>'+
      '<div class="num"><span class="big">'+x.strokes+'</span><small>strokes</small></div><div class="num"><span class="big">'+x.pts+'</span><small>points</small></div></summary>'+table(HEAD,rows)+'</details>';
  });
  return h+'</section>';
}
function vTeams(c){
  const t=teams(cfg,scores);
  let h='<h2>Team leaderboard</h2><p class="sub">All four players’ gross strokes and net Stableford points added together.</p><div class="teamgrid">';
  ['S','M'].forEach(k=>{
    h+='<div class="tcard '+k+'"><h3 class="'+k+'-t">'+TEAM[k]+'</h3><div><span class="big">'+t[k].pts+'</span><span class="lbl">points</span></div><div><span class="big" style="font-size:26px">'+t[k].strokes+'</span><span class="lbl">strokes</span></div>'+
      [0,1,2].map(r=>'<div class="kv"><span>'+esc(cfg.courses[r].name)+'</span><span>'+t[k].rounds[r].pts+' pts · '+t[k].rounds[r].strokes+'</span></div>').join('')+
      '<div class="kv"><span>Cup points</span><span><b>'+half(c.won[k])+'</b></span></div></div>';
  });
  return h+'</div>';
}
function vScores(){
  const c=cfg.courses[rnd], ms=matches(cfg,rnd);
  let h='<h2>Enter scores</h2><div class="seg">'+[0,1,2].map(r=>'<button data-act="rnd" data-v="'+r+'" aria-pressed="'+(r===rnd)+'">Day '+(r+1)+' · '+esc(cfg.courses[r].name)+'<small>'+FMT[r].short+'</small></button>').join('')+'</div>';
  h+='<div class="holes">'+Array.from({length:18},(_,i)=>{
    const done=cfg.players.every(p=>hole(cfg,scores,rnd,p.id,i).g>0);
    return '<button data-act="hole" data-v="'+i+'" class="'+(done?'done':'')+'" aria-pressed="'+(i===hl)+'" aria-label="Hole '+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div>';
  h+='<div class="holehead"><button class="nav" data-act="hole" data-v="'+((hl+17)%18)+'" aria-label="Previous hole">‹</button><div style="text-align:center"><div class="big">Hole '+(hl+1)+'</div><div class="sub">Par '+c.par[hl]+' · Stroke '+c.si[hl]+'</div></div><button class="nav" data-act="hole" data-v="'+((hl+1)%18)+'" aria-label="Next hole">›</button></div>';
  if(fdb&&!unlocked()) h+=pinBox();
  ms.forEach(m=>{
    const st=matchState(cfg,scores,rnd,m), o=st.holes[hl];
    h+='<section class="panel"><div class="ph"><h3>'+(rnd<2?'Pair '+m.id:'Match '+m.id)+'</h3><span class="pill '+(st.lead||'')+'">'+esc(st.text)+'</span></div>';
    [...m.S,...m.M].forEach(id=>{
      const p=player(cfg,id), x=hole(cfg,scores,rnd,id,hl);
      h+='<div class="row"><span class="dot '+p.team+'"></span><div class="grow"><div style="font-weight:600">'+esc(p.name)+'</div><div class="sub">'+(x.st?x.st+' shot'+(x.st>1?'s':''):'No shot')+(x.g?' · <button class="clr" data-act="clear" data-p="'+id+'"'+(canWrite?'':' disabled')+'>clear</button>':'')+'</div></div>'+
        '<div class="step"><button data-act="dec" data-p="'+id+'" aria-label="One fewer for '+esc(p.name)+'"'+(canWrite?'':' disabled')+'>−</button><output>'+(x.g||'–')+'</output><button data-act="inc" data-p="'+id+'" aria-label="One more for '+esc(p.name)+'"'+(canWrite?'':' disabled')+'>+</button></div>'+
        '<div class="num"><span class="big">'+show(x.pts)+'</span><small>pts</small></div></div>';
    });
    h+='<div class="res"><span><span class="S-t">Stingers '+show(o.s)+'</span> – <span class="M-t">'+show(o.q)+' Mulligans</span></span><span>'+(o.res?(o.res==='H'?'Hole halved':TEAM[o.res]+' win the hole'):'Waiting for all scores')+'</span></div></section>';
  });
  h+='<p class="sub">First tap on + or − sets par, then adjust. Picked up? Enter 10; it scores 0 points.</p>';
  return h;
}
function vSetup(){
  if(!draft) draft=clone(cfg);
  const d=draft; let h='<h2>Setup</h2>';
  if(fdb&&!unlocked()) h+=pinBox();
  h+='<section class="panel"><div class="ph"><h3>Players and handicaps</h3></div><div class="form">'+
    d.players.map((p,i)=>'<div class="frow"><span class="dot '+p.team+'"></span><input type="text" id="pn'+i+'" data-f="name" data-i="'+i+'" value="'+esc(p.name)+'" aria-label="Player name"><input type="number" id="ph'+i+'" data-f="hcp" data-i="'+i+'" min="0" max="54" value="'+p.hcp+'" aria-label="Handicap"></div>').join('')+'</div></section>';
  [0,1].forEach(r=>{
    h+='<section class="panel"><div class="ph"><h3>Day '+(r+1)+' pairs · '+FMT[r].short+'</h3><span class="sub">A plays A, B plays B</span></div><div class="form">'+
      d.players.map(p=>'<div class="frow"><span class="dot '+p.team+'"></span><span class="grow">'+esc(p.name)+'</span><div class="ab">'+['A','B'].map(g=>'<button data-act="pair" data-r="'+r+'" data-p="'+p.id+'" data-v="'+g+'" aria-pressed="'+(d.pairs[r][p.id]===g)+'">'+g+'</button>').join('')+'</div></div>').join('')+'</div></section>';
  });
  h+='<section class="panel"><div class="ph"><h3>Day 3 singles</h3></div><div class="form">'+
    d.singles.map((x,i)=>'<div class="frow"><span class="dot S"></span><span style="width:76px">'+esc((d.players.find(p=>p.id===x.s)||{}).name||'')+'</span><span class="sub">v</span><select id="sg'+i+'" data-f="single" data-i="'+i+'" aria-label="Opponent">'+
      d.players.filter(p=>p.team==='M').map(p=>'<option value="'+p.id+'"'+(p.id===x.m?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>').join('')+'</div></section>';
  d.courses.forEach((c,ci)=>{
    h+='<details class="panel"><summary class="row"><span class="chev">›</span><div class="grow"><b>Day '+(ci+1)+' course: '+esc(c.name)+'</b><div class="sub">Par '+c.par.reduce((a,b)=>a+b,0)+' · pars and stroke indexes</div></div></summary><div class="cgrid"><span class="lbl">Hole</span><span class="lbl">Par</span><span class="lbl">Stroke</span>'+
      c.par.map((v,i)=>'<span>'+(i+1)+'</span><input type="number" id="cp'+ci+'_'+i+'" data-f="par" data-c="'+ci+'" data-i="'+i+'" min="3" max="6" value="'+v+'" aria-label="Par hole '+(i+1)+'"><input type="number" id="cs'+ci+'_'+i+'" data-f="si" data-c="'+ci+'" data-i="'+i+'" min="1" max="18" value="'+c.si[i]+'" aria-label="Stroke index hole '+(i+1)+'">').join('')+'</div></details>';
  });
  h+='<div class="btns"><button class="btn" data-act="save"'+(canWrite?'':' disabled')+'>Save setup</button><button class="btn ghost" data-act="reset">Undo my changes</button></div>';
  if(setupMsg) h+='<p class="msg'+(/^(Saved|Test|All|PIN)/.test(setupMsg)?' ok':'')+'">'+esc(setupMsg)+'</p>';
  h+='<section class="panel"><div class="ph"><h3>Scorer PIN</h3></div><div class="form"><p class="sub">Digits only. Scorers enter it once per phone. Leave it blank for no PIN.</p><div class="frow"><input type="text" inputmode="numeric" id="newPin" maxlength="8" autocomplete="off" value="'+(canWrite?esc(pin):'')+'" aria-label="New scorer PIN"'+(canWrite?'':' disabled')+'><button class="btn ghost" data-act="savepin"'+(canWrite?'':' disabled')+'>Save PIN</button></div></div></section>';
  h+='<section class="panel"><div class="ph"><h3>Test data</h3></div><div class="form"><p class="sub">Load the spreadsheet’s test scores (every player 4 on every hole) to check the leaderboards, then clear them before the tour.</p><div class="btns"><button class="btn ghost" data-act="sample"'+(canWrite?'':' disabled')+'>Load test scores</button>'+
    (confirmClear?'<button class="btn danger" data-act="clearall2">Yes, delete every score</button><button class="btn ghost" data-act="clearno">Keep them</button>':'<button class="btn ghost" data-act="clearall"'+(canWrite?'':' disabled')+'>Clear all scores</button>')+'</div></div></section>';
  return h;
}
function render(){
  canWrite=!!fdb&&unlocked();
  const c=renderBoard(); setStatus();
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const open=[...document.querySelectorAll('#view details')].map(d=>d.open);
  const keep=window.scrollY;
  $('view').innerHTML = tab==='cup'?vCup(c):tab==='players'?vPlayers():tab==='teams'?vTeams(c):tab==='scores'?vScores():vSetup();
  document.querySelectorAll('#view details').forEach((d,i)=>{if(open[i]&&render.last===tab)d.open=true});
  if(render.last===tab) window.scrollTo(0,keep);
  render.last=tab;
}

/* ---------- saving ---------- */
function key(r,pid){return 'r'+(r+1)+'_'+pid}
function setScore(r,pid,i,v){
  if(!canWrite) return;
  const arr=((scores[r]||{})[pid]||[]).slice(); for(let k=0;k<18;k++) arr[k]=arr[k]||0;
  arr[i]=v; scores[r][pid]=arr; queue(r,pid); render();
}
function queue(r,pid,delay){
  const k=key(r,pid); dirty.add(k); clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    chain[k]=(chain[k]||Promise.resolve()).then(()=>{
      const body={r:r+1,p:pid,h:(scores[r][pid]||[]).slice()};
      return fdb.ref('tour/scores/'+k).set(body).then(()=>{ if(JSON.stringify(body.h)===JSON.stringify(scores[r][pid])) dirty.delete(k); });
    }).catch(writeFailed);
  }, delay==null?500:delay);
}
function writeFailed(e){
  $('status').className='status warn'; $('status').textContent='A score did not save ('+((e&&e.code)||'error')+'). Check your connection and enter it again.';
}
function soft(){
  const a=document.activeElement;
  if(tab==='setup'||(a&&a.tagName==='INPUT')){canWrite=!!fdb&&unlocked();renderBoard();setStatus()} else render();
}
function onScores(snap){
  const next=[{},{},{}], all=snap.val()||{};
  Object.keys(all).forEach(k=>{const x=all[k]; if(!x||!(x.r>=1&&x.r<=3)||!x.p)return; const h=arr(x.h).slice(0,18).map(v=>+v||0); while(h.length<18)h.push(0); next[x.r-1][x.p]=h});
  dirty.forEach(k=>{const r=+k[1]-1,pid=k.slice(3); if((scores[r]||{})[pid]) next[r][pid]=scores[r][pid]});
  scores=next; loaded=true; soft();
}
function onConfig(snap){
  const x=snap.val();
  if(x){
    const n={players:arr(x.players),courses:arr(x.courses).map(c=>({name:String(c.name||''),par:arr(c.par).map(Number),si:arr(c.si).map(Number)})),pairs:arr(x.pairs),singles:arr(x.singles)};
    if(n.players.length===8&&n.courses.length===3&&n.courses.every(c=>c.par.length===18&&c.si.length===18)&&n.pairs.length===2&&n.singles.length===4) cfg=n;
  }
  if(tab!=='setup') draft=null;
  soft();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;store.set('tab',tab);if(tab==='setup'){draft=clone(cfg);setupMsg='';confirmClear=false}window.scrollTo(0,0);render();return}
  const b=e.target.closest('[data-act]'); if(!b||b.disabled)return; const a=b.dataset.act, v=b.dataset.v, pid=b.dataset.p;
  if(a==='rnd'){rnd=+v;store.set('rnd',rnd);render()}
  else if(a==='hole'){hl=+v;store.set('hole',hl);render()}
  else if(a==='inc'||a==='dec'){e.preventDefault();const g=hole(cfg,scores,rnd,pid,hl).g;setScore(rnd,pid,hl,g?Math.min(15,Math.max(1,g+(a==='inc'?1:-1))):cfg.courses[rnd].par[hl])}
  else if(a==='clear'){e.preventDefault();setScore(rnd,pid,hl,0)}
  else if(a==='pair'){draft.pairs[+b.dataset.r][pid]=v;setupMsg='';render()}
  else if(a==='reset'){draft=clone(cfg);setupMsg='';render()}
  else if(a==='save'){
    const err=validate(draft); if(err){setupMsg=err;render();return}
    setupMsg='Saving…';render();
    fdb.ref('tour/config').set(clone(draft)).then(()=>{cfg=clone(draft);setupMsg='Saved. Everyone now sees this setup.';render()}).catch(er=>{setupMsg='Setup did not save ('+((er&&er.code)||'error')+').';render()});
  }
  else if(a==='sample'){cfg.players.forEach(p=>{for(let r=0;r<3;r++){scores[r][p.id]=Array(18).fill(4);queue(r,p.id,0)}});setupMsg='Test scores loaded.';render()}
  else if(a==='clearall'){confirmClear=true;render()}
  else if(a==='clearno'){confirmClear=false;render()}
  else if(a==='clearall2'){
    confirmClear=false;
    Object.keys(timers).forEach(x=>clearTimeout(timers[x])); dirty.clear();
    scores=[{},{},{}]; setupMsg='Clearing…'; render();
    fdb.ref('tour/scores').remove().then(()=>{setupMsg='All scores cleared.';render()}).catch(er=>{setupMsg='Could not clear the scores ('+((er&&er.code)||'error')+').';render()});
  }
  else if(a==='unlock'){
    myPin=($('pinIn').value||'').trim(); store.set('pin',myPin);
    pinMsg=unlocked()?'':'That PIN is not right. Check the group message.'; render();
  }
  else if(a==='savepin'){
    const v=($('newPin').value||'').trim();
    if(!/^\d{0,8}$/.test(v)){setupMsg='The PIN must be digits only, up to 8.';render();return}
    fdb.ref('tour/pin').set(v||null).then(()=>{myPin=v;store.set('pin',v);pin=v;setupMsg=v?'PIN saved. Scorers now need '+v+'.':'PIN removed. Anyone with the link can capture scores.';render()}).catch(er=>{setupMsg='PIN did not save ('+((er&&er.code)||'error')+').';render()});
  }
});
document.addEventListener('input',e=>{
  const el=e.target, f=el.dataset&&el.dataset.f; if(!f||!draft)return; const i=+el.dataset.i;
  if(f==='name') draft.players[i].name=el.value.slice(0,20)||'Player';
  else if(f==='hcp') draft.players[i].hcp=Math.max(0,Math.min(54,Math.round(+el.value||0)));
  else if(f==='single') draft.singles[i].m=el.value;
  else if(f==='par') draft.courses[+el.dataset.c].par[i]=Math.round(+el.value||0);
  else if(f==='si') draft.courses[+el.dataset.c].si[i]=Math.round(+el.value||0);
});

render();
(function start(){
  try{
    firebase.initializeApp(FIREBASE); fdb=firebase.database();
  }catch(e){fdb=null;setStatus();return}
  const dead=er=>{$('status').className='status warn';$('status').textContent='The database refused the connection ('+((er&&er.code)||'error')+'). Check the Firebase rules.'};
  fdb.ref('.info/connected').on('value',s=>{online=!!s.val();setStatus()});
  fdb.ref('tour/pin').on('value',s=>{pin=String(s.val()||'');soft()},dead);
  fdb.ref('tour/config').on('value',onConfig,dead);
  fdb.ref('tour/scores').on('value',onScores,dead);
})();
</script>
